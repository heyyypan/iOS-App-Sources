
name: Update GlobalRefresh source

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-globalrefresh-source
  cancel-in-progress: false

jobs:
  update-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check and update latest release
        run: python scripts/update_source.py

      - name: Commit changed source and release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add GlobalRefresh-PiP-AltStore-Source.json
          git add globalrefresh-release-state.json

          if git diff --cached --quiet; then
            echo "No new release. Nothing to commit."
          else
            git commit -m "Update GlobalRefresh source"
            git push
          fi
